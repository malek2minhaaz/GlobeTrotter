<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobeTrotter — Plan Your Journey. Experience More.</title>
    <meta
      name="description"
      content="GlobeTrotter is a personalised multi-city travel planner. Build day-by-day itineraries, discover activities, track your budget, and share your journey."
    />
    <meta name="theme-color" content="#0f766e" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GlobeTrotter" />
    <meta property="og:title" content="GlobeTrotter — Plan Your Journey. Experience More." />
    <meta
      property="og:description"
      content="Build multi-city trips, add experiences, track your budget and share your itinerary."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('globetrotter-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
